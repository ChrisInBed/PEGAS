//RP-1 Patch for KIU Chinese Human Spaceflight Pack
//Chris 20260130
//TACLS Support
@PART[KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment]:FOR[RealismOverhaulTACLS]:NEEDS[TacLifeSupport]
{
	@MODULE[ModuleFuelTanks]
	{
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 62440
		}
	}
	
	MODULE
	{
		name = TacGenericConverter
		converterName = CO2 Vacuum Scrubber
		tag = Life Support
		StartActionName = Start CO2 Scrubber
		StopActionName = Stop CO2 Scrubber
		conversionRate = 6.0
		GeneratesHeat = False
		UseSpecialistBonus = False

		INPUT_RESOURCE
		{
			ResourceName = CarbonDioxide
			Ratio = 0.006216
			FlowMode = STAGE_PRIORITY_FLOW
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 0.1
		}
	}
}
//kerbalism
@PART[KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment]:NEEDS[ROCapsules,FeatureHabitat]:AFTER[zzzKerbalism]
{
	%MODULE[Habitat]
	{
		%volume = 8.95
		%surface = 35
	}
	%MODULE[ModuleFuelTanks]
	{
		TANK
		{
			name = Nitrogen
			amount = 400
			maxAmount = 400
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 100
		}
	}
	MODULE
	{
		name = Comfort
		bonus = exercise
		desc = A treadmill designed to permit exercise in zero-g is included. The crew will love it.
	}
	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		capacity = 10
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _AdvScrubber
		title = Advanced CO2 Scrubber
		capacity = 10
		running = true
	}
	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = Comfort
		title = Treadmill
		repair = Engineer
		mtbf = 36288000
		extra_cost = 0.25
		extra_mass = 0.05
	}
}
//RealAntennas
@PART[KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment]:BEFORE[RealAntennas]:NEEDS[RealAntennas]
{
	!MODULE[ModuleDataTransmitter],* {}
	MODULE
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = S		//Default to S-band
	}
	MODULE
	{
		name = ModuleRealAntenna
		antennaDiameter = 0.8	//Guess of phased array size based on pictures
		RFBand = K	//Default to K-band
	}
}
//kOS Support
@PART[KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment]:FOR[kOS]:NEEDS[kOS]
{
	%MODULE[kOSProcessor]
	{
		%diskSpace = 50000
		%diskSpaceCostFactor = 0.001
		%diskSpaceMassFactor = 0.00000005
		%ECPerInstruction = 0.00000008
	}
	%MODULE[HardDrive]
	{
		%title = Data Storage
		%sampleCapacity = 10
		%dataCapacity = -1
	}
}
//ModuleAvionics
@PART[KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment]:FOR[RP-0]
{
    %MODULE[ModuleAvionics]
    {
        %massLimit = 50.0
        %toggleable = true
        %disabledkW = 0.05
        %enabledkW = 0.05
    }
}
@PART[KCLV_CZ-10_Stage*_Tank]:FOR[RP-0]
{
    %MODULE[ModuleAvionics]
    {
        %massLimit = 5000.0
        %toggleable = true
        %disabledkW = 0.05
        %enabledkW = 0.05
    }
}
//AdjustableCoMShifter
@PART[KCHS_Mengzhou_ReEntry_Module]
{
	%CoMOffset = 0.0, -0.54, 0.0
	%MODULE[AdjustableCoMShifter]
	{
		%DescentModeCoM = 0.35, 0, 0	//Mengzhou should reenter "windows-down" to protect crew hatch
	}
}